
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .jogo {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
            box-shadow: 0 5px 20px #3335;
        }

        h1 {
            color: #6741a5;
        }

        input {
            padding: 12px;
            width: 80%;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #6741a5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4d2c80;
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="jogo">
        <h1>🎯 Adivinhe o Número!</h1>

        <p>Escolha um número entre 1 e 100.</p>

        <input type="number" id="palpite"
               min="1" max="100"
               placeholder="Digite seu palpite">

        <br>

        <button onclick="verificar()">Adivinhar</button>
        <button onclick="reiniciar()">Reiniciar</button>

        <p id="mensagem">Boa sorte!</p>
        <p id="tentativas">Tentativas: 0</p>
    </div>

    <script>
        let numeroSecreto = Math.floor(Math.random() * 100) + 1;
        let tentativas = 0;
        let terminou = false;

        function verificar() {
            if (terminou) return;

            let palpite = Number(
                document.getElementById("palpite").value
            );

            let mensagem = document.getElementById("mensagem");

            if (!palpite || palpite < 1 || palpite > 100) {
                mensagem.innerText = "Digite um número entre 1 e 100!";
                return;
            }

            tentativas++;

            if (palpite === numeroSecreto) {
                mensagem.innerText =
                    "🎉 Parabéns! Você acertou!";
                terminou = true;
            } else if (palpite < numeroSecreto) {
                mensagem.innerText = "📈 Tente um número MAIOR!";
            } else {
                mensagem.innerText = "📉 Tente um número MENOR!";
            }

            document.getElementById("tentativas").innerText =
                "Tentativas: " + tentativas;

            document.getElementById("palpite").value = "";
        }

        function reiniciar() {
            numeroSecreto = Math.floor(Math.random() * 100) + 1;
            tentativas = 0;
            terminou = false;

            document.getElementById("mensagem").innerText =
                "Novo jogo! Boa sorte!";

            document.getElementById("tentativas").innerText =
                "Tentativas: 0";

            document.getElementById("palpite").value = "";
        }
    </script>

</body>
</html>
